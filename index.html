<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>РОБОЧА Land Hub Notion</title>
    <meta
      name="description"
      content="Інтерактивна карта активних ділянок LandHub."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="./styles.css?v=20260916-1" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-bar">
          <h1>РОБОЧА Land Hub Notion</h1>
          <nav class="category-tabs" aria-label="Категорії карти">
            <button class="category-tab is-active" data-category="cadastral" type="button">
              <span class="tab-symbol">📚</span>
              <span>Кадастровий</span>
            </button>
            <button class="category-tab is-active" data-category="landmatch" type="button">
              <span class="tab-symbol">💛</span>
              <span>LandMatch Parcel</span>
            </button>
            <button class="category-tab is-active" data-category="realization" type="button">
              <span class="tab-symbol">📍</span>
              <span>Ділянки на реалізацію</span>
            </button>
          </nav>
        </div>
      </header>

      <section id="age-filters" class="processing-filters" aria-label="Фільтри за датою додавання">
        <button class="age-chip" data-age-days="3" type="button">
          <span class="chip-check">▢</span>
          <span>3 дні</span>
        </button>
        <button class="age-chip" data-age-days="7" type="button">
          <span class="chip-check">▢</span>
          <span>1 тиждень</span>
        </button>
        <button class="age-chip" data-age-days="14" type="button">
          <span class="chip-check">▢</span>
          <span>2 тижні</span>
        </button>
        <button class="age-chip" data-age-days="21" type="button">
          <span class="chip-check">▢</span>
          <span>3 тижні</span>
        </button>
      </section>

      <main class="map-card">
        <div id="map" aria-label="Карта ділянок"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="./app.js?v=20260916-1" defer></script>
  </body>
</html>
